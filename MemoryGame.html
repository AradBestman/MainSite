<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game — 1v1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/MemoryGame.css">

</head>

<body>

    <!-- Setup screen: players enter their names before the match starts -->
    <div id="setupScreen" class="setup-screen">
        <div class="setup-card">
            <h1>Memory Game — 1 vs 1</h1>
            <p class="setup-sub">Best of 3 rounds. Enter both names to start.</p>
            <form id="setupForm">
                <div class="setup-field">
                    <label for="player1Name">Player 1 name</label>
                    <input type="text" id="player1Name" maxlength="16" placeholder="Player 1" autocomplete="off">
                </div>
                <div class="setup-field">
                    <label for="player2Name">Player 2 name</label>
                    <input type="text" id="player2Name" maxlength="16" placeholder="Player 2" autocomplete="off">
                </div>
                <button type="submit" id="startBtn">Start Match</button>
            </form>
        </div>
    </div>

    <!-- Game screen -->
    <div id="gameScreen" class="container-xl my-5 bg-success-subtle d-flex" hidden>

        <div class="scoreboard">
            <div class="player-card" id="playerCard0">
                <span class="player-card-name" id="playerName0"></span>
                <span class="player-card-rounds" id="playerRounds0">Rounds: 0</span>
            </div>
            <div class="round-info">
                <span id="roundLabel">Round 1 of 3</span>
            </div>
            <div class="player-card" id="playerCard1">
                <span class="player-card-name" id="playerName1"></span>
                <span class="player-card-rounds" id="playerRounds1">Rounds: 0</span>
            </div>
        </div>

        <div class="container-row">
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
        </div>
        <div class="container-row">
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
        </div>
        <div class="container-row">
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
        </div>
        <div class="container-row">
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
            <div class="box"><img src="" alt=""></div>
        </div>

        <button id="NewGamebtn">Restart Match</button>
    </div>

    <!-- Round-over overlay (shown between rounds when the match isn't decided yet) -->
    <div id="roundOverlay" class="overlay" hidden>
        <div class="overlay-card">
            <h2 id="roundOverlayTitle">Round won!</h2>
            <p id="roundOverlayText"></p>
            <button id="nextRoundBtn">Next Round</button>
        </div>
    </div>

    <!-- Game over overlay: shown once one player wins 2 rounds -->
    <div id="gameOverOverlay" class="overlay" hidden>
        <div class="overlay-card">
            <h2>Game Over</h2>
            <p id="gameOverText"></p>
            <button id="newMatchBtn">New Match</button>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script><!--Boostrap-->


    <script src="./js/cardGame.js"></script>
</body>

</html>
